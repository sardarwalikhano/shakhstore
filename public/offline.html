<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f28c28">
  <title>SHAKH STORE - Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8fc;color:#17243a;font-family:system-ui,sans-serif}
    main{width:min(100%,520px);padding:36px;border:1px solid #e2e8f0;border-radius:24px;background:white;text-align:center;box-shadow:0 12px 36px #17243a0d}
    .mark{display:grid;place-items:center;width:56px;height:56px;margin:auto;border-radius:18px;background:#f28c28;color:white;font-size:28px;font-weight:900}
    h1{margin:22px 0 10px;font-size:26px}p{color:#64748b;line-height:2}
    button{margin-top:18px;border:0;border-radius:12px;background:#f28c28;color:white;padding:12px 22px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">ش</div>
    <h1>ئێستا پەیوەندی ئینتەرنێت نییە</h1>
    <p>SHAKH STORE کاتێک پەیوەندی ئینتەرنێت بگەڕێتەوە، دووبارە بار دەبێتەوە. زانیاری تایبەتی و داواکارییەکان بە شێوەی Offline پاشەکەوت ناکرێن.</p>
    <button type="button" onclick="location.reload()">هەوڵدانەوە</button>
  </main>
</body>
</html>
