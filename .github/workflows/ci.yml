name: SHAKH STORE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: m11-ci-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, audit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); console.log("npm audit:", JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));'

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
