name: SHAKH STORE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, audit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require("./npm-audit.json");
          console.log("npm audit severity summary:", report.metadata?.vulnerabilities ?? {});
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (item.via ?? []).map((entry) =>
              typeof entry === "string" ? entry : `${entry.name}: ${entry.title ?? entry.url ?? "advisory"}`
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via,
            }));
          }
          NODE

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Supabase migration inventory (read-only)
        run: npm run audit:supabase-migrations

      - name: Wallet migration invariants
        run: npm run check:wallet-migration

      - name: Production build
        run: npm run build

  wallet-migration-integration:
    name: PostgreSQL 17 wallet and delivery integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shakh_wallet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shakh_wallet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply M17 and run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shakh_wallet_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-wallet-topup-migration.sql

      - name: Apply M18 and run delivery-zone checkout integration tests
        env:
          PGPASSWORD: postgres
          TEST_ORDER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          createdb -h localhost -U postgres shakh_order_test
          export TEST_ORDER_DATABASE_URL=postgres://postgres:postgres@localhost:5432/shakh_order_test
          psql "$TEST_ORDER_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-order-service-zone-migration.sql
